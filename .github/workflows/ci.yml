name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Linters & Formatters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python Code Formatting (Ruff)
        run: ruff format --check .

      - name: Check Python Linting (Ruff)
        run: ruff check .

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format

      - name: Check C++ Code Formatting (clang-format)
        run: |
          CPP_FILES=$(find core stages trace tests -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.cc" -o -name "*.c" \) 2>/dev/null || true)
          if [ -n "$CPP_FILES" ]; then
            echo "Checking formatting for:"
            echo "$CPP_FILES"
            echo "$CPP_FILES" | xargs clang-format --dry-run --Werror
          else
            echo "No C++ files found to check."
          fi

  cpp-build-and-test:
    name: C++ Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libomp-dev ccache

      - name: Cache FetchContent Dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: v2-${{ runner.os }}-${{ matrix.compiler }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ matrix.compiler }}-fetchcontent-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: v2-${{ runner.os }}-${{ matrix.compiler }}-ccache-${{ github.sha }}
          restore-keys: |
            v2-${{ runner.os }}-${{ matrix.compiler }}-ccache-

      - name: Clean Stale FetchContent Subbuilds
        run: |
          if [ -d "build/_deps" ]; then
            find build/_deps -name "CMakeCache.txt" -delete || true
            find build/_deps -type d -name "*-subbuild" -exec rm -rf {} + || true
          fi

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build C++ Targets
        run: cmake --build build --parallel

      - name: Run CTest Suite
        run: ctest --test-dir build --output-on-failure

      - name: Smoke Test Renderer Executable
        run: ./build/path_tracer --config config.ci.json

      - name: Verify Generated Render Artifacts
        run: |
          test -s output/final_demo/01_raw.png || (echo "final_demo raw missing" && exit 1)
          test -s output/final_demo/02_direct.png || (echo "final_demo direct missing" && exit 1)
          test -s output/final_demo/03_pathtraced.png || (echo "final_demo pathtraced missing" && exit 1)
          test -s output/final_demo/04_denoised.png || (echo "final_demo denoised missing" && exit 1)
          test -s output/cornell_box/03_pathtraced.png || (echo "cornell_box pathtraced missing" && exit 1)
          echo "Render artifacts successfully generated!"

      - name: Upload Render Artifacts
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-images
          path: |
            output/final_demo/*.png
            output/cornell_box/*.png
          if-no-files-found: error

  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest Suite
        run: pytest -v --durations=10

      - name: Test Scene Preprocessing Pipeline (prep)
        run: |
          python -m prep scenes/prep_demo.json -o scene_prepared_test.json --trace trace_prep_test.json
          test -s scene_prepared_test.json || (echo "scene_prepared_test.json missing or empty" && exit 1)
          test -s trace_prep_test.json || (echo "trace_prep_test.json missing or empty" && exit 1)
          echo "Prep pipeline test succeeded!"
